name: skeleton_storage
description: Presigned photo upload (presign, direct PUT with progress and cancel, complete) for the kotlin-skeleton storage modules, with a photo field and a stored-image widget.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: 3.47.9

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image_picker: ^1.1.2
  skeleton_api_client: any # workspace sibling

dev_dependencies:
  flutter_test:
    sdk: flutter
