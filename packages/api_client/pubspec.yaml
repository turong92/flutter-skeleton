name: skeleton_api_client
description: REST client for the kotlin-skeleton backend (/api/v1). Dio, envelope unwrapping, the standard ApiError. Pure Dart.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1

dev_dependencies:
  # The Flutter SDK pins test_api (flutter_test), and the workspace resolves
  # once: this is the newest `test` that agrees with it.
  test: ^1.31.1
