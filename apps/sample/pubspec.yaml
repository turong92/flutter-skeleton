name: sample
description: Reference app of flutter-skeleton. Sign in, board, payment, push and settings tabs on the sample server of kotlin-skeleton.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: 3.47.9

dependencies:
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  skeleton_api_client: any # workspace sibling
  skeleton_auth: any # workspace sibling
  skeleton_board: any # workspace sibling
  skeleton_legal: any # workspace sibling
  skeleton_payment: any # workspace sibling
  skeleton_push: any # workspace sibling
  skeleton_ui: any # workspace sibling

dev_dependencies:
  dio: ^5.11.1 # the fake adapter in tests speaks its request and response types
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.6 # the push device store keeps its id there; tests set mock values

flutter:
  uses-material-design: true
