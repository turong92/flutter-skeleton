name: starter
description: Starter app of flutter-skeleton. Sign up, sign in, reset a password, delete the account.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: 3.47.9

dependencies:
  # #if push
  firebase_core: ^5.1.0 # Firebase.initializeApp in firebase_setup.dart
  # #endif
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  skeleton_auth: any # workspace sibling
  # #if board
  skeleton_board: any # workspace sibling
  # #endif
  # #if iap
  skeleton_iap: any # workspace sibling
  # #endif
  skeleton_legal: any # workspace sibling
  # #if notifications
  skeleton_notifications: any # workspace sibling
  # #endif
  # #if push
  skeleton_push: any # workspace sibling
  # #endif
  # #if realtime
  skeleton_realtime: any # workspace sibling
  # #endif
  # #if storage
  skeleton_storage: any # workspace sibling
  # #endif
  skeleton_ui: any # workspace sibling

dev_dependencies:
  flutter_test:
    sdk: flutter
  dio: ^5.11.1 # the fake adapter in tests speaks its request and response types
  skeleton_api_client: any # workspace sibling; its testing.dart has the fake HTTP adapter

flutter:
  uses-material-design: true
