name: starter
description: Starter app of flutter-skeleton. Sign up, sign in, reset a password, delete the account.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: 3.47.9

dependencies:
  # #if push
  firebase_core: ^5.1.0 # Firebase.initializeApp in firebase_setup.dart
  # #endif
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.2 # gen_l10n output (lib/l10n) imports it
  # #if social-login-kakao
  kakao_flutter_sdk_user: ^2.1.0 # KakaoSdk.init in main
  # #endif
  # #if social-login-apple
  sign_in_with_apple: ^8.2.0 # SignInWithAppleButton (HIG)
  # #endif
  # #if ads
  skeleton_ads: any # workspace sibling
  # #endif
  skeleton_api_client: any # workspace sibling; ApiRequestError, and its testing.dart has the fake HTTP adapter of the tests
  skeleton_auth: any # workspace sibling
  # #if board
  skeleton_board: any # workspace sibling
  # #endif
  # #if i18n
  skeleton_i18n: any # workspace sibling
  # #endif
  # #if iap
  skeleton_iap: any # workspace sibling
  # #endif
  skeleton_legal: any # workspace sibling
  # #if notifications
  skeleton_notifications: any # workspace sibling
  # #endif
  # #if push
  skeleton_push: any # workspace sibling
  # #endif
  # #if realtime
  skeleton_realtime: any # workspace sibling
  # #endif
  # #if social-login
  skeleton_social_login: any # workspace sibling
  # #endif
  # #if social-login-apple
  skeleton_social_login_apple: any # workspace sibling
  # #endif
  # #if social-login-google
  skeleton_social_login_google: any # workspace sibling
  # #endif
  # #if social-login-kakao
  skeleton_social_login_kakao: any # workspace sibling
  # #endif
  # #if social-login-naver
  skeleton_social_login_naver: any # workspace sibling
  # #endif
  # #if storage
  skeleton_storage: any # workspace sibling
  # #endif
  skeleton_ui: any # workspace sibling

dev_dependencies:
  flutter_test:
    sdk: flutter
  dio: ^5.11.1 # the fake adapter in tests speaks its request and response types
  # #if iap
  in_app_purchase: ^3.2.3 # ProductDetails of the store screen test
  # #endif

flutter:
  generate: true # gen_l10n runs on pub get / build (l10n.yaml)
  uses-material-design: true
