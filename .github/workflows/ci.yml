name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the earlier run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The Flutter version lives in one place: environment.flutter of the root pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: dart pub global activate melos
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: melos run analyze
      - run: melos run test
      # The catalog says what the repo is; the sibling repos are not cloned here, so only this repo is checked.
      - run: dart tool/build_capabilities.dart --check
      # Catches a broken Gradle setup or manifest. Not run on the machine this
      # skeleton was written on (no Android SDK there): first verified by CI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --debug
        working-directory: apps/starter
      - run: flutter build apk --debug
        working-directory: apps/sample
